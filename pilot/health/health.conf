# Copy this file to /etc/default/wanderer-health.

# Wireless interface used by the Pilot.
WANDERER_WIFI_INTERFACE=wlan0

# Optional Base PC hostname or IPv4 address. Leave empty to disable the ping
# check until the Base address is fixed or discoverable.
WANDERER_BASE_HOST=

# Seconds between checks when running as a service.
WANDERER_CHECK_INTERVAL=5

# Signal lower than -68 dBm is WARN; lower than -76 dBm is FAULT.
WANDERER_WEAK_SIGNAL_DBM=-68
WANDERER_FAULT_SIGNAL_DBM=-76
